apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  labels:
    app: devops-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: devops-app:v3
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: devops-app-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: devops-app-secret
                  key: API_TOKEN
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
